<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="300" rx="54" fill="#15171D"/>

  <!-- Three input lines, varying weight, feeding into the mux -->
  <rect x="58" y="112" width="34" height="10" rx="3" fill="#8B8D93"/>
  <rect x="58" y="145" width="34" height="10" rx="3" fill="#F6F4EF"/>
  <rect x="58" y="178" width="34" height="10" rx="3" fill="#8B8D93"/>

  <!-- Multiplexer wedge: wide (three inputs) narrowing to one point -->
  <path d="M 92,100 L 92,200 L 195,163 L 195,137 Z" fill="#E3A83B"/>

  <!-- Single output line, thicker than any individual input -->
  <rect x="195" y="140" width="55" height="20" rx="4" fill="#F6F4EF"/>
</svg>
